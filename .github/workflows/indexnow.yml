name: IndexNow
# Tells Bing/Yandex/Naver/Seznam about changed pages after GitHub Pages deploys the site.
on:
  deployment_status:
  workflow_dispatch:
jobs:
  ping:
    if: ${{ github.event_name == 'workflow_dispatch' || (github.event.deployment_status.state == 'success' && github.event.deployment.environment == 'github-pages') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sleep 30 && python3 scripts/indexnow.py
