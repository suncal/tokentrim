name: JARVIS pages
# Renders content/jarvis/*.json (committed by the sales-ops publisher) into pages, then Pages deploys the commit.
on:
  push:
    branches: [main]
    paths: ['content/jarvis/**', 'jarvis_pages.py']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: jarvis-pages
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render and commit pages
        # Rendered files (sitemap.xml, index.html) conflict when two posts land seconds apart, and a
        # rebase then dropped the newer page. So: always render on top of the latest main, retry the push.
        run: |
          git config user.name "jarvis-pages-bot"
          git config user.email "jarvis@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main && git reset -q --hard origin/main
            python3 jarvis_pages.py
            git add -A
            git diff --cached --quiet && exit 0
            git commit -qm "Render JARVIS pages"
            git push -q origin HEAD:main && exit 0
            sleep $((i * 5))
          done
          exit 1
