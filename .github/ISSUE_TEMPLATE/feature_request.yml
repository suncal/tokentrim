name: Feature request
description: A rule, report or integration that would cut more tokens
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What's eating your tokens?
      description: The workflow or tool output that bloats context. Numbers from `bin/tokentrim audit` help a lot.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like tokentrim to do?
